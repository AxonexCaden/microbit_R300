name: Nightly build

# 03:00 HKT = 19:00 UTC. GitHub cron is UTC-only and Hong Kong has no DST.
# The cron fires every night, but `check` is skipped until the repository variable
# NIGHTLY_ENABLED is "true"; manual runs always go through, so the whole thing can
# be tested before it is ever scheduled.
#
# A nightly that rebuilds identical binaries is pure cost: when `main` has moved the
# check job asks the compare API what changed and skips the product if *every* touched
# path is CI or docs (.github/, docs/, *.md). Any doubt — API error, empty or truncated
# file list — falls back to building, and `force: true` overrides everything.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build every product even when main was already attempted"
        type: boolean
        default: false
      dry_run:
        description: "Print the plan but dispatch nothing"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # to dispatch the per-product workflows

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  check:
    if: vars.NIGHTLY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.decide.outputs.plan }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: ci
          sparse-checkout-cone-mode: false

      - name: Who still needs building?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          gh api "repos/$REPO/actions/workflows?per_page=100" > "$RUNNER_TEMP/workflows.json"
          gh api "repos/$REPO/actions/runs?branch=main&per_page=100" > "$RUNNER_TEMP/runs.json"

          # State is per product because every product has its own workflow: the
          # last completed run of build-<id>.yml *is* that product's attempt.
          python3 - "$main" "$RUNNER_TEMP" <<'PY'
          import json, os, pathlib, re, subprocess, sys

          main, tmp = sys.argv[1], pathlib.Path(sys.argv[2])
          force = os.environ.get("FORCE") == "true"
          dry = os.environ.get("DRY_RUN") == "true"
          repo = os.environ["REPO"]

          # A commit that only touches CI or docs cannot change the firmware, so it
          # must not cost a full rebuild (2026-11-14: "retention-days: 3" moved main
          # on three repos and the binary came out identical). Anything not listed
          # here still rebuilds — ci/products.json included.
          NON_SOURCE = re.compile(r"^(\.github/|docs/|.*\.md$|\.gitignore$)")

          _cfg_cache = {}

          def config_only(old, new):
              """True only when *every* path changed between old and new is CI/docs."""
              key = (old, new)
              if key in _cfg_cache:
                  return _cfg_cache[key]
              verdict = False                      # default: build (fail-safe)
              try:
                  out = subprocess.run(
                      ["gh", "api", f"repos/{repo}/compare/{old}...{new}"],
                      capture_output=True, text=True, check=True, timeout=30,
                  ).stdout
                  data = json.loads(out)
                  files = [f["filename"] for f in data.get("files") or []]
                  ahead = data.get("total_commits") or 0
                  if data.get("status") == "identical" or ahead == 0:
                      verdict = True
                  elif files and len(files) < 300:
                      # 300 is the compare API's file cap: a truncated list proves
                      # nothing, and an empty list with commits ahead proves nothing
                      # either (previously seen), so both fall through to "build".
                      verdict = all(NON_SOURCE.match(f) for f in files)
              except Exception as exc:             # 404, rate limit, bad JSON…
                  print(f"  compare {old[:7]}...{new[:7]} unavailable ({exc.__class__.__name__}) — will build")
              _cfg_cache[key] = verdict
              return verdict

          products = [p["id"] for p in json.loads(pathlib.Path("ci/products.json").read_text())["products"]]
          by_file = {w["path"].split("/")[-1]: w["id"] for w in json.loads((tmp / "workflows.json").read_text())["workflows"]}

          busy_states = {"queued", "in_progress", "waiting", "requested", "pending"}
          last, busy = {}, set()
          for run in json.loads((tmp / "runs.json").read_text())["workflow_runs"]:  # newest first
              wid = run["workflow_id"]
              if run["status"] in busy_states:
                  busy.add(wid)
              elif run["status"] == "completed" and wid not in last:
                  last[wid] = run

          plan = []
          for pid in products:
              wf = f"build-{pid}.yml"
              wid = by_file.get(wf)
              if wid is None:
                  print(f"  {pid:<30} x  no {wf} here — skipped")
                  continue
              if force:
                  plan.append({"workflow": wf, "why": "forced"})
              elif wid in busy:
                  print(f"  {pid:<30} .  already running — skipped")
              elif wid not in last:
                  plan.append({"workflow": wf, "why": "never built"})
              elif last[wid]["head_sha"] == main:
                  print(f"  {pid:<30} =  attempted ({last[wid]['conclusion']}) — skipped")
              elif config_only(last[wid]["head_sha"], main):
                  print(f"  {pid:<30} =  config-only since {last[wid]['head_sha'][:7]} — skipped")
              else:
                  plan.append({"workflow": wf, "why": f"main moved since {last[wid]['head_sha'][:7]}"})

          print(f"  main {main[:7]} · {len(plan)} to build" + (" (dry run)" if dry else ""))
          for p in plan:
              print(f"    + {p['workflow']}  ({p['why']})")
          (tmp / "plan.json").write_text(json.dumps([] if dry else plan))
          PY

          echo "plan=$(cat "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Nightly build"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/plan.json" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    needs: check
    if: needs.check.outputs.plan != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch each product
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PLAN: ${{ needs.check.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" | jq -r '.[] | "\(.workflow)\t\(.why)"' |
          while IFS=$'\t' read -r wf why; do
            echo "-> $wf  ($why)"
            gh workflow run "$wf" --repo "$REPO" --ref main
            sleep 2   # sixteen workflows in a row: keep well clear of the dispatch limit
          done
