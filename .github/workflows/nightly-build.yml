name: Nightly build

# The nightly logic lives in AxonexCaden/ci-workflows so there is one copy to fix.
# This file only owns the cron, the manual inputs and the NIGHTLY_ENABLED gate.

on:
  schedule:
    # 03:00 HKT = 19:00 UTC (GitHub cron is UTC; Hong Kong has no DST)
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when main was already attempted"
        type: boolean
        default: false
      dry_run:
        description: "Print the decision but do not dispatch anything"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # to dispatch the build workflow

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  nightly:
    # The cron fires every night but does nothing until the repository variable is set.
    if: vars.NIGHTLY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    uses: AxonexCaden/ci-workflows/.github/workflows/nightly-build.yml@de813c52c2312d9299f4d60e421a15efa081f944
    with:
      workflow: build-microbit.yml
      force: ${{ inputs.force || false }}
      dry_run: ${{ inputs.dry_run || false }}
